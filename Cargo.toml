[package]
name = "barmato"
version = "1.0.1"
edition = "2021"
description = "Bar + Tomato — 极简环境式番茄钟：任务栏细条环境反馈，无弹窗、无数字、无声音"
license = "MIT"
repository = "https://github.com/31i45/Barmato"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
softbuffer = "0.4"
tray-icon = "0.19"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = true
