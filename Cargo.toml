[package]
name = "winmato"
version = "2.2.1"
edition = "2021"
description = "Win + Tomato — 极简环境式番茄钟：托盘图标四格可视化（四格 ≡ 4 个番茄），无弹窗、无数字、无声音"
license = "MIT"
repository = "https://github.com/31i45/Winmato"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }
tray-icon = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 2
lto = true
