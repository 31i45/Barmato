name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Verify / Build / Publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy（零警告门槛）
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          Copy-Item target/release/winmato.exe Winmato.exe
          Compress-Archive -Path Winmato.exe -DestinationPath Winmato.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Winmato.exe
            Winmato.zip
          generate_release_notes: true
