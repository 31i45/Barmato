name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Verify / Build / Publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test（发布前强制全绿）
        run: cargo test

      - name: Clippy（零警告门槛）
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Copy-Item target/release/barmato.exe "barmato-$tag-x86_64-windows.exe"
          Compress-Archive -Path target/release/barmato.exe -DestinationPath "barmato-$tag-x86_64-windows.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: barmato-${{ github.ref_name }}-x86_64-windows.*
          generate_release_notes: true
